<p-dialog [modal]="true" [(visible)]="isVisible" (onHide)="hideDialog()" [style]="{ width: '75rem' }">
   <app-ajout-vehicule [hideFooterButtons]="true"/>

        <p-button label="Cancel" severity="danger" (click)="hideDialog()" />
        <p-button label="Save" (click)="onSave()" />
    </div>

</p-dialog>
