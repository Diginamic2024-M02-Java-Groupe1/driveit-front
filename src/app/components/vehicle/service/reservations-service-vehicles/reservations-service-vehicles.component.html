<div class="grid grid-cols-1 md:grid-cols-4 gap-4 max-w-[1440px] mx-auto p-4 min-h-[calc(100vh-80px)]">
  <!-- Filter panel - takes 1/4 of the space on desktop -->
  <div class="md:col-span-1">
    <div class="bg-white rounded-xl shadow-md p-5 sticky top-20">
      <h2 class="text-gray-800 font-bold text-xl mb-4">Filtrer les véhicules</h2>

      <form [formGroup]="filterForm" (ngSubmit)="onFilter()">
        <div class="mb-4">
          <label for="dateTimeStart" class="block text-sm font-medium mb-1">Date et heure début :</label>
          <p-calendar
            formControlName="startDateTime"
            id="dateTimeStart"
            [showTime]="true"
            hourFormat="24"
            [stepMinute]="15"
            [firstDayOfWeek]="1"
            [minDate]="currentDate"
            dateFormat="dd.mm.yy"
            [showIcon]="true"
            styleClass="w-full">
          </p-calendar>
        </div>

        <div class="mb-4">
          <label for="dateTimeEnd" class="block text-sm font-medium mb-1">Date et heure fin :</label>
          <p-calendar
            formControlName="endDateTime"
            id="dateTimeEnd"
            [showTime]="true"
            hourFormat="24"
            [stepMinute]="15"
            [firstDayOfWeek]="1"
            [minDate]="currentDate"
            dateFormat="dd.mm.yy"
            [showIcon]="true"
            styleClass="w-full">
          </p-calendar>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-400 text-white py-2 px-6 rounded-md hover:bg-emerald-600 transition-colors disabled:opacity-5 disabled:cursor-not-allowed"
          [disabled]="filterForm.invalid || isLoading"
        >
          @if(isLoading){
            <span>Chargement...</span>
          }@else{
            <span>Rechercher</span>
          }
        </button>
      </form>
    </div>
  </div>

  <!-- Vehicles carousel - takes 3/4 of the space on desktop -->
  <div class="md:col-span-3 flex flex-col h-full" [class.hidden]="!showCarousel">
    @if (filteredVehicles.length > 0) {
      <div class="bg-white rounded-xl shadow-md p-4 flex flex-col">
        <h2 class="text-gray-800 font-bold text-xl mb-4">Véhicules disponibles</h2>

        <div class="card">
          <p-carousel
            [value]="filteredVehicles"
            [numVisible]="3"
            [numScroll]="1"
            [responsiveOptions]="[
              {
                breakpoint: '1400px',
                numVisible: 3,
                numScroll: 1
              },
              {
                breakpoint: '1199px',
                numVisible: 2,
                numScroll: 1
              },
              {
                breakpoint: '767px',
                numVisible: 1,
                numScroll: 1
              }
            ]">
            <ng-template let-vehicle pTemplate="item">
              <div class="border border-surface-200 rounded m-2 p-4">
                <div class="mb-4">
                  <div class="relative mx-auto">
                    <img
                      src="{{ vehicle.url }}"
                      [alt]="vehicle.model.brand.name + ' ' + vehicle.model.name"
                      class="w-full rounded-md h-48 object-cover" />
                    <p-tag
                      [value]="vehicle.status === 'AVAILABLE' ? 'Disponible' : 'Indisponible'"
                      [severity]="vehicle.status === 'AVAILABLE' ? 'success' : 'danger'"
                      class="absolute"
                      [ngStyle]="{ 'left.px': 5, 'top.px': 5 }" />
                  </div>
                </div>
                <div class="mb-4 font-medium">{{ vehicle.model.brand.name }} {{ vehicle.model.name }}</div>
                <div class="flex justify-between items-center">
                  <div class="mt-0 font-semibold">
                    <span [ngClass]="{'text-green-600': vehicle.motorization.name === 'Électrique'}">
                      {{ vehicle.motorization.name }}
                    </span>
                  </div>
                  <span>
                    <p-button
                      icon="pi pi-shopping-cart"
                      label="Réserver"
                      (onClick)="reserveVehicle(vehicle)" />
                  </span>
                </div>
              </div>
            </ng-template>
          </p-carousel>
        </div>
      </div>
    } @else {
      <div class="bg-white rounded-xl shadow-md p-8 flex items-center justify-center min-h-[300px]">
        <div class="text-center">
          <p class="text-gray-600 text-lg mb-2">Pas de véhicules disponibles</p>
          <p class="text-gray-500">Veuillez modifier vos critères de recherche</p>
        </div>
      </div>
    }
  </div>
</div>
